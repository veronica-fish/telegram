<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Whisky SHOP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #17212b);
            --text-color: var(--tg-theme-text-color, #ffffff);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            padding: 15px; margin: 0;
        }
        h2 { text-align: center; margin-bottom: 20px; font-size: 20px; }
        .btn {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; padding: 16px; margin-bottom: 12px; border: none; border-radius: 12px;
            font-size: 15px; font-weight: 600; color: #ffffff; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .btn-green { background: linear-gradient(135deg, #28a745, #1e7e34); }
        .btn-blue { background: linear-gradient(135deg, #007bff, #0056b3); }
        .btn-yellow { background: linear-gradient(135deg, #ffc107, #d39e00); color: #000; }
        .btn-purple { background: linear-gradient(135deg, #6f42c1, #4b2a8a); }
        .btn-grey { background: linear-gradient(135deg, #6c757d, #494f54); }
        .hidden { display: none; }
        .desc { font-size: 13px; font-weight: normal; opacity: 0.8; margin-top: 5px; display: block; }
    </style>
</head>
<body>

    <div id="menu-katalog">
        <h2 id="lbl_katalog_title">🛍️ Katalog Produk</h2>
        
        <button class="btn btn-green" onclick="bukaDetail('otp')">
            <div>
                <span id="lbl_otp_title">⚡ OTP Email</span>
                <span class="desc" id="lbl_otp_desc">Keterangan...</span>
            </div>
        </button>
        
        <button class="btn btn-blue" onclick="bukaDetail('akun')">
            <div>
                <span id="lbl_akun_title">📧 Akun Email</span>
                <span class="desc" id="lbl_akun_desc">Keterangan...</span>
            </div>
        </button>
        
        <button class="btn btn-yellow" onclick="bukaDetail('nib')">
            <div>
                <span id="lbl_nib_title">📄 NIB Perusahaan</span>
                <span class="desc" id="lbl_nib_desc">Keterangan...</span>
            </div>
        </button>
        
        <button class="btn btn-purple" onclick="bukaDetail('tw')">
            <div>
                <span id="lbl_tw_title">🪪 ThirdWave SMS</span>
                <span class="desc" id="lbl_tw_desc">Keterangan...</span>
            </div>
        </button>
    </div>

    <!-- DETAIL OTP -->
    <div id="detail-otp" class="hidden">
        <h2 id="lbl_detail_otp">⚡ OTP Email</h2>
        <button class="btn btn-green" onclick="beli('1 OTP Email', 'Rp 100.000')"><span>1 OTP</span> <span>Rp 100.000 | $6.50</span></button>
        <button class="btn btn-green" onclick="beli('2 OTP Email', 'Rp 200.000')"><span>2 OTP</span> <span>Rp 200.000 | $13.00</span></button>
        <button class="btn btn-green" onclick="beli('3 OTP Email', 'Rp 280.000')"><span>3 OTP</span> <span>Rp 280.000 | $18.00</span></button>
        <button class="btn btn-green" onclick="beli('4 OTP Email', 'Rp 360.000')"><span>4 OTP</span> <span>Rp 360.000 | $23.00</span></button>
        <button class="btn btn-green" onclick="beli('5 OTP Email', 'Rp 440.000')"><span>5 OTP</span> <span>Rp 440.000 | $28.00</span></button>
        <button class="btn btn-grey" onclick="kembaliKeKatalog()"><span id="lbl_btn_back">↻ Kembali</span></button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Membaca parameter bahasa dari URL
        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || 'id'; 

        const translations = {
            'id': {
                katalog_title: "🛍️ Katalog Produk",
                otp_title: "⚡ OTP Email", otp_desc: "Masa Aktif mailbox: 2 Hari. Opsi Kouta: x1-x5.",
                akun_title: "📧 Akun Email", akun_desc: "Full mailbox access. Kredensial instan.",
                nib_title: "📄 NIB Perusahaan", nib_desc: "Legalitas bisnis PT resmi Indonesia.",
                tw_title: "🪪 ThirdWave SMS", tw_desc: "Akun Teams. Limit 15k & 30k.",
                btn_back: "↻ Kembali"
            },
            'en': {
                katalog_title: "🛍️ Product Catalog",
                otp_title: "⚡ OTP Email", otp_desc: "Mailbox active: 2 Days. Quota options: x1-x5.",
                akun_title: "📧 Email Account", akun_desc: "Full mailbox access. Instant credentials.",
                nib_title: "📄 Company NIB", nib_desc: "Official Indonesian PT business legality.",
                tw_title: "🪪 ThirdWave SMS", tw_desc: "Teams account. Limit 15k & 30k.",
                btn_back: "↻ Back"
            },
            'zh': {
                katalog_title: "🛍️ 产品目录",
                otp_title: "⚡ OTP 邮箱", otp_desc: "邮箱有效期: 2天。配额选项: x1-x5。",
                akun_title: "📧 邮箱账户", akun_desc: "完整邮箱访问权限。即时凭据。",
                nib_title: "📄 公司 NIB", nib_desc: "经过验证的印尼PT公司合法数据。",
                tw_title: "🪪 ThirdWave SMS", tw_desc: "Teams账户。提供15k和30k限额。",
                btn_back: "↻ 返回"
            }
        };

        function applyLanguage() {
            const t = translations[lang] || translations['id'];
            document.getElementById('lbl_katalog_title').innerText = t.katalog_title;
            document.getElementById('lbl_otp_title').innerText = t.otp_title;
            document.getElementById('lbl_otp_desc').innerText = t.otp_desc;
            document.getElementById('lbl_akun_title').innerText = t.akun_title;
            document.getElementById('lbl_akun_desc').innerText = t.akun_desc;
            document.getElementById('lbl_nib_title').innerText = t.nib_title;
            document.getElementById('lbl_nib_desc').innerText = t.nib_desc;
            document.getElementById('lbl_tw_title').innerText = t.tw_title;
            document.getElementById('lbl_tw_desc').innerText = t.tw_desc;
            
            document.getElementById('lbl_btn_back').innerText = t.btn_back;
        }

        applyLanguage();

        function bukaDetail(kategori) {
            document.getElementById('menu-katalog').classList.add('hidden');
            document.getElementById('detail-' + kategori).classList.remove('hidden');
        }

        function kembaliKeKatalog() {
            document.querySelectorAll('div[id^="detail-"]').forEach(el => el.classList.add('hidden'));
            document.getElementById('menu-katalog').classList.remove('hidden');
        }

        function beli(namaProduk, harga) {
            let data = { aksi: "beli", produk: namaProduk, harga: harga };
            tg.sendData(JSON.stringify(data));
            tg.close();
        }
    </script>
</body>
</html>
